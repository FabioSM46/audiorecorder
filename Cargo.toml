[package]
name = "audiorecorder"
version = "0.1.0"
edition = "2021"
description = "Registratore audio desktop per microfono e audio di sistema (PipeWire/PulseAudio)"

[dependencies]
eframe = "0.36"
egui = "0.36"
anyhow = "1"
chrono = "0.4"
hound = "3.5"
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
